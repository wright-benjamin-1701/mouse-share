[project]
name = "mouse-share"
version = "0.1.0"
description = "Custom software KVM for sharing keyboard and mouse across machines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
linux = ["evdev>=1.7", "python-xlib>=0.33"]
macos = ["pyobjc-framework-Quartz>=10.0", "pyobjc-framework-Cocoa>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.12"]

[project.scripts]
mouse-share = "mouse_share.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mouse_share"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
